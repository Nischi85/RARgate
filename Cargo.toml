[package]
name = "rargate"
version = "1.0.0"
edition = "2021"
authors = ["RARGate Team"]
description = "High-performance FUSE filesystem with RAR archive support, intelligent filtering, and multi-server media integration"
license = "MIT"

[dependencies]
# FUSE filesystem
fuser = "0.15"
libc = "0.2"

# Configuration & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Async runtime & concurrency
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "fs", "process", "time", "signal", "sync"] }

# Logging & error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "1.0"

# File system operations
inotify = { version = "0.11", default-features = false }

# Process management
nix = { version = "0.29", features = ["fs", "user", "poll"] }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures = "0.3"

# Time & caching
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dashmap = "6.1"
filetime = "0.2"
lru = "0.12"

# String processing
wildmatch = "2.3"

# Parallel processing
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive"] }
const_format = "0.2"

# HTTP client for media server API integration
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1.0"
async-trait = "0.1"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"

[[bin]]
name = "rargate"
path = "src/main.rs"
